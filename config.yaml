experiment:
  name: E2_light
  num_classes: 5
  log_dir: runs/
  note: final_pool_48x1

data:
  root_dir: ./data
  fs: 200
  window: 200
  step: 50
  channel: 8
  input_scale: 128.0
  remove_label_0: true

filters:
  notch:
    freq: 50
    Q: 30
  bandpass:
    low: 20
    high: 100
    order: 4

train:
  epochs: 200
  batch_size: 200
  learning_rate: 0.001
  weight_decay: 0.001
  num_workers: 0
  test_size: 0.2
  random_seed: 42

collect:
  train_output_dir: ./data
  test_output_dir: ./test_data
  apply_filters: false
  guided:
    gestures: [1, 2, 3, 4, 5]
    repetitions: 50
    action_seconds: 1.0
    rest_seconds: 1.0

myo:
  module_root: ./myo_support
  dll_root: ./myo_support/bin
  sdk_path:
  connect_timeout: 15.0

deploy:
  server_ip: 192.168.3.9
  server_port: 3333
  rest_gate:
    enabled: true
    abs_mean_threshold: 2.3
    rms_threshold: 3.5
    channel_abs_threshold: 1.5
    min_active_channels: 2
  quantization:
    samples_per_class:

model:
  conv_layers:
    - out_channels: 32
      kernel_size: 2
      pool_size: 2
    - out_channels: 64
      kernel_size: 2
      pool_size: 2
    - out_channels: 64
      kernel_size: 2
      pool_size: null
  final_pool: [48, 1]
  fc_hidden: 1024
  dropout_rate: 0.2
